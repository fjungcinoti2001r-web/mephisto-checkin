<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>「メフィスト賞」全通计划</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%238c3b2f'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' font-size='280'>📖</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root {
    --bg: #f4efe6;          /* 温暖米白色背景 */
    --paper: #fffcf7;       /* 纸张白 */
    --paper-card: #f7f2ea;  /* 卡片浅色底 */
    --border: #d4c5b9;      /* 浅复古边框 */
    --border-dark: #8c6d53; /* 深棕线条 */
    --accent: #8c3b2f;      /* 昭和红印章色 */
    --gold: #b8860b;        /* 典雅金 */
    --text: #3b302a;        /* 墨水黑棕 */
    --muted: #827267;       /* 灰棕说明文字 */
    --retro-brown: #5c3a21; /* 复古咖啡棕色 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Serif SC", "Source Han Serif CN", "STSong", "SimSun", serif;
    padding-bottom: 90px;
    background-image: radial-gradient(circle, #e6ded1 1px, transparent 1px);
    background-size: 20px 20px;
  }
  .container { max-width: 980px; margin: 0 auto; padding: 0 10px; }
  
  /* 顶部昭和复古横幅 */
  header {
    margin: 12px 0 12px;
    background: var(--paper);
    border: 2px solid var(--border-dark);
    border-radius: 4px;
    padding: 16px 10px;
    text-align: center;
    position: relative;
    box-shadow: 0 3px 10px rgba(60,45,35,0.06);
  }
  header::before, header::after {
    content: "◆";
    position: absolute;
    color: var(--accent);
    font-size: 0.7rem;
    top: 6px;
  }
  header::before { left: 8px; }
  header::after { right: 8px; }

  h1 { 
    font-size: 1.35rem; 
    letter-spacing: 2px; 
    color: var(--accent);
    margin-bottom: 4px;
    font-weight: bold;
  }
  .subtitle {
    font-size: 0.75rem;
    color: var(--muted);
    font-family: sans-serif;
    letter-spacing: 0.5px;
  }

  .sync-badge {
    display: inline-block;
    margin-top: 6px;
    font-size: 0.7rem;
    padding: 2px 8px;
    border: 1px dashed var(--border-dark);
    color: var(--muted);
    font-family: sans-serif;
    background: #faf6f0;
  }
  .sync-badge.online { color: #2b8a3e; border-color: #2b8a3e; background: rgba(43,138,62,0.06); }

  /* 总体与个人进度面板 */
  .overview-box {
    background: var(--paper);
    border: 2px solid var(--border-dark);
    border-radius: 4px;
    padding: 12px;
    margin-bottom: 12px;
    box-shadow: 0 3px 8px rgba(60,45,35,0.05);
  }
  
  .personal-progress-section {
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px dashed var(--border);
  }
  .personal-stats-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.82rem;
    margin-bottom: 4px;
    font-family: sans-serif;
  }
  .personal-stats-header b { color: var(--accent); font-size: 0.9rem; }
  
  /* 当前侦探行：右侧放打卡分享按钮 */
  .detective-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .share-btn-inline {
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--border-dark);
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 0.75rem;
    cursor: pointer;
    font-weight: bold;
    font-family: sans-serif;
    white-space: nowrap;
  }
  .share-btn-inline:active { opacity: 0.8; }

  .personal-bar {
    height: 8px;
    background: #e8e0d5;
    border: 1px solid var(--border-dark);
    border-radius: 3px;
    overflow: hidden;
  }
  .personal-fill {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.3s;
  }

  .team-progress-section {
    margin-bottom: 10px;
  }
  .team-stats-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.78rem;
    margin-bottom: 4px;
    font-family: sans-serif;
  }
  .team-stats-header b { color: var(--gold); }
  .total-bar {
    height: 5px;
    background: #e8e0d5;
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .total-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--border-dark), var(--gold));
    width: 0%;
    transition: width 0.3s;
  }

  .members-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding-top: 2px;
  }
  .member-card {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 6px 4px;
    cursor: pointer;
    text-align: center;
  }
  .member-card.active {
    background: #f2e6dc;
    border-color: var(--accent);
    box-shadow: inset 0 0 3px rgba(140,59,47,0.2);
  }
  .m-top { display: flex; flex-direction: column; font-size: 0.78rem; font-weight: bold; gap: 1px; }
  .m-cnt { color: var(--accent); font-size: 0.68rem; font-family: monospace; }
  .m-bar { height: 3px; background: #e0d5cb; margin-top: 4px; overflow: hidden; }
  .m-fill { height: 100%; background: var(--accent); width: 0%; }

  /* 筛选与排序栏 */
  .toolbar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  select, input[type="search"] {
    background: var(--paper);
    color: var(--text);
    border: 1px solid var(--border-dark);
    padding: 8px 10px;
    border-radius: 3px;
    font-size: 0.8rem;
    outline: none;
    font-family: sans-serif;
  }
  select { flex: 1; min-width: 110px; }
  input[type="search"] { flex: 2; min-width: 140px; }

  /* 书单列表 */
  .book-list { display: flex; flex-direction: column; gap: 8px; }
  .book-item {
    background: var(--paper);
    border: 1px solid var(--border-dark);
    border-radius: 4px;
    padding: 10px 12px;
    box-shadow: 0 1px 4px rgba(60,45,35,0.03);
  }
  .book-item.is-read { border-left: 4px solid var(--accent); }
  
  .b-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 6px;
  }
  .b-info { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .b-id {
    font-family: monospace;
    font-size: 0.72rem;
    color: var(--accent);
    background: #f7eee3;
    border: 1px solid var(--border);
    padding: 1px 4px;
    border-radius: 2px;
    font-weight: bold;
  }
  .b-title { 
    font-size: 0.98rem; 
    font-weight: 800; 
    color: var(--retro-brown); 
  }
  .b-author { font-size: 0.75rem; color: var(--muted); }
  .b-avg { font-size: 0.78rem; font-weight: 600; color: var(--gold); white-space: nowrap; font-family: sans-serif; }
  .b-avg.none { color: #a89f91; font-size: 0.72rem; }

  .pills { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .pill {
    font-size: 0.7rem;
    padding: 1px 5px;
    border-radius: 2px;
    background: #eee8e0;
    color: #a89f91;
    border: 1px solid #dcd2c6;
    font-family: sans-serif;
  }
  .pill.done {
    background: #e6cbca;
    color: var(--accent);
    border-color: #c99390;
    font-weight: bold;
  }

  .my-action {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    background: #fcf8f2;
    border: 1px solid var(--border);
    padding: 8px;
    border-radius: 3px;
  }
  .read-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    cursor: pointer;
    font-weight: bold;
    font-family: sans-serif;
    color: var(--text);
    padding: 2px 0;
  }
  .read-btn input { accent-color: var(--accent); width: 18px; height: 18px; cursor: pointer; }
  .stars { display: inline-flex; gap: 4px; cursor: pointer; }
  .star { font-size: 1.2rem; color: #d0c4b8; padding: 0 2px; }
  .star.on { color: var(--gold); }
  .comment-box {
    width: 100%;
    background: #fff;
    border: 1px solid var(--border-dark);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 2px;
    font-size: 0.8rem;
    font-family: sans-serif;
    margin-top: 2px;
  }
  .comments-feed {
    margin-top: 6px;
    font-size: 0.75rem;
    color: #6e6056;
    display: flex;
    flex-direction: column;
    gap: 2px;
    border-top: 1px dashed var(--border);
    padding-top: 4px;
    font-family: sans-serif;
  }
  .c-row b { color: var(--accent); margin-right: 4px; }

  /* 底部悬浮快捷栏 */
  .bottom-dock {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255, 252, 247, 0.98);
    border-top: 2px solid var(--border-dark);
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 999;
    box-shadow: 0 -4px 10px rgba(60,45,35,0.08);
    backdrop-filter: blur(4px);
    font-family: sans-serif;
    font-size: 0.78rem;
  }
  .dock-left { display: flex; align-items: center; gap: 6px; }
  .dock-left select {
    background: var(--paper);
    border: 1px solid var(--border-dark);
    padding: 3px 6px;
    border-radius: 3px;
    font-weight: bold;
    color: var(--accent);
    font-size: 0.78rem;
  }
  .dock-music { display: flex; align-items: center; gap: 6px; }
  .music-icon {
    cursor: pointer;
    font-size: 1.1rem;
    user-select: none;
    opacity: 0.4;
    transition: 0.15s;
  }
  .music-icon.playing {
    opacity: 1;
    transform: scale(1.1);
  }
  .dock-music input[type="range"] {
    width: 65px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* 分享海报弹窗样式（纯净无按钮，仅展示长按图片） */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 2000;
    padding: 15px;
  }
  .modal-overlay.active { display: flex; }
  .poster-card {
    background: #fffcf7;
    border: 3px solid var(--border-dark);
    border-radius: 6px;
    padding: 12px;
    width: 100%;
    max-width: 340px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
  
  /* 海报内部样式模板（用于后台转换为干净图片） */
  .poster-inner {
    background: #fffcf7;
    border: 2px solid var(--border-dark);
    padding: 18px;
    border-radius: 4px;
    background-image: radial-gradient(circle, #e6ded1 1px, transparent 1px);
    background-size: 15px 15px;
    text-align: center;
  }
  .poster-title { font-size: 1.15rem; color: var(--accent); font-weight: bold; letter-spacing: 2px; margin-bottom: 4px; }
  .poster-sub { font-size: 0.72rem; color: var(--muted); margin-bottom: 14px; font-family: sans-serif; }
  .poster-box {
    background: var(--paper-card);
    border: 1px solid var(--border-dark);
    padding: 10px 12px;
    border-radius: 4px;
    margin-bottom: 10px;
    text-align: left;
    font-family: sans-serif;
    font-size: 0.82rem;
  }
  .poster-box p { margin: 6px 0; display: flex; justify-content: space-between; }
  .poster-box b { color: var(--accent); }
  
  #posterImageContainer img { width: 100%; max-height: 70vh; object-fit: contain; border: 1px solid var(--border-dark); border-radius: 4px; display: block; background: #fffcf7; user-select: none; -webkit-user-select: none; -webkit-touch-callout: default; }
  #posterImageContainer { min-height: 48px; }
  .poster-loading { padding: 18px 8px; color: var(--muted); font: 0.82rem sans-serif; }
</style>
</head>
<body>

<!-- 本地背景音乐 -->
<audio id="bgm" loop preload="auto">
  <source src="bgm.mp3" type="audio/mpeg">
</audio>

<div class="container">
  <header>
    <h1>「メフィスト賞」</h1>
    <p class="subtitle">―― 全通计划 ――</p>
    <div class="sync-badge" id="syncBadge"></div>
  </header>

  <!-- 进度面板 -->
  <div class="overview-box">
    <div class="personal-progress-section">
      <div class="detective-row">
        <span class="personal-stats-header" style="margin-bottom:0;">🕵️ 当前侦探：<b id="curMemberLabelText">咖喱棒</b></span>
        <button class="share-btn-inline" onclick="openSharePoster()">📊 打卡分享</button>
      </div>
      <div style="font-size:0.78rem; color:var(--muted); font-family:sans-serif; margin: 4px 0;">已读：<b id="personalCount" style="color:var(--accent)">0</b>/71 (<b id="personalPct">0%</b>)</div>
      <div class="personal-bar"><div class="personal-fill" id="personalFill"></div></div>
    </div>

    <div class="team-progress-section">
      <div class="team-stats-header">
        <span>小队整体进度</span>
        <span>已读: <b id="unlockCount">0</b>/71 ｜ 总人次: <b id="totalReads">0</b>/568</span>
      </div>
      <div class="total-bar"><div class="total-fill" id="totalFill"></div></div>
    </div>

    <div class="members-grid" id="membersGrid"></div>
  </div>

  <!-- 筛选与排序栏 -->
  <div class="toolbar">
    <select id="filterSel" onchange="renderList()">
      <option value="all">全部档案 (71)</option>
      <option value="unread">我未读的</option>
      <option value="read">我已读的</option>
      <option value="team_read">小队已读</option>
    </select>
    <select id="sortSel" onchange="renderList()">
      <option value="id_asc">按届数正序</option>
      <option value="id_desc">按届数倒序</option>
      <option value="avg_desc">⭐均分最高</option>
      <option value="cnt_desc">🔥人气最高</option>
    </select>
    <input type="search" id="searchBox" placeholder="搜索书名..." oninput="renderList()">
  </div>

  <!-- 书籍列表 -->
  <div class="book-list" id="bookList"></div>
</div>

<!-- 底部悬浮快捷栏 -->
<div class="bottom-dock">
  <div class="dock-left">
    <span>当前:</span>
    <select id="dockMemberSelect" onchange="switchMemberFromDock(this.value)">
    </select>
  </div>
  <div class="dock-music">
    <span id="musicIcon" class="music-icon" onclick="toggleBGM()" title="点击播放/暂停音乐">🎵</span>
    <input type="range" min="0" max="1" step="0.05" value="0.3" oninput="changeVolume(this.value)" title="音量调节">
  </div>
</div>

<!-- 打卡分享海报弹窗（纯图片展示，无冗余按钮，点击空白处自动关闭） -->
<div class="modal-overlay" id="shareModal" onclick="if(event.target===this)closeSharePoster()">
  <div class="poster-card">
    <!-- 隐藏的原始排版模板 -->
    <div id="posterContainer" style="position: absolute; left: -9999px; top: -9999px; width: 320px;">
      <div class="poster-inner">
        <div class="poster-title">◆ 「メフィスト賞」 ◆</div>
        <div class="poster-sub">全通计划</div>
        <div class="poster-box">
          <p><span>当前侦探：</span><b id="posterMemberName">咖喱棒</b></p>
          <p><span>已读：</span><b id="posterPersonalText">0 / 71 部</b></p>
          <p><span>总阅读人次：</span><b id="posterTotalReadsText">0 / 568</b></p>
        </div>
        <div style="font-size:0.68rem; color: #827267; font-family: sans-serif;">―― 面白ければなんでもあり ――</div>
      </div>
    </div>
    
    <!-- 实时生成的纯净海报图片层，手机端直接长按即可保存 -->
    <div id="posterImageContainer"><div class="poster-loading">正在生成打卡海报…</div></div>
    <div style="font-size: 0.72rem; color: var(--muted); font-family: sans-serif; margin-top: 8px;">长按上方图片即可保存海报</div>
  </div>
</div>

<script>
// ================= 1. SUPABASE 配置区 =================
const SUPABASE_URL = "https://grvtnqdsmqamzpfhhafy.supabase.co"; 
const SUPABASE_ANON_KEY = "sb_publishable_YZooexpHdHjVeivMzpE8Xw_VD5GIucV";

let supabaseClient = null;
if (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const badge = document.getElementById("syncBadge");
  badge.textContent = "◆开始阅读◆";
  badge.classList.add("online");
}

// ================= BGM 音乐控制 =================
const bgm = document.getElementById("bgm");
bgm.volume = 0.3;

function toggleBGM() {
  const icon = document.getElementById("musicIcon");
  if (bgm.paused) {
    bgm.play().then(() => {
      icon.classList.add("playing");
      icon.title = "点击暂停音乐";
    }).catch(e => {
      alert("请确认同目录下已放入 bgm.mp3 文件，或点击页面任意位置后再试。");
    });
  } else {
    bgm.pause();
    icon.classList.remove("playing");
    icon.title = "点击播放音乐";
  }
}
function changeVolume(val) { bgm.volume = val; }

// ================= 3. 数据与状态 =================
const LOCAL_KEY = "mephisto_mobile_v3";
const USER_KEY = "mephisto_mobile_user_v3";

let currentMember = localStorage.getItem(USER_KEY) || MEMBERS[0];
if (!MEMBERS.includes(currentMember)) currentMember = MEMBERS[0];

let records = JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}");

function getRec(bookId, member) {
  return records[`${bookId}_${member}`] || { is_read: false, score: null, comment: "" };
}

async function fetchFromSupabase() {
  if (!supabaseClient) return;
  const { data, error } = await supabaseClient.from("checkins").select("*");
  if (!error && data) {
    records = {};
    data.forEach(row => {
      records[`${row.book_id}_${row.member}`] = {
        is_read: row.is_read,
        score: row.score ? Number(row.score) : null,
        comment: row.comment || ""
      };
    });
    localStorage.setItem(LOCAL_KEY, JSON.stringify(records));
    renderOverview();
    renderList();
  }
}

async function updateRec(bookId, member, patch) {
  const key = `${bookId}_${member}`;
  const prev = getRec(bookId, member);
  const next = { ...prev, ...patch };
  records[key] = next;
  localStorage.setItem(LOCAL_KEY, JSON.stringify(records));
  renderOverview();
  renderList();

  if (supabaseClient) {
    await supabaseClient.from("checkins").upsert({
      book_id: bookId,
      member: member,
      is_read: next.is_read,
      score: next.score,
      comment: next.comment,
      updated_at: new Date().toISOString()
    });
  }
}

// ================= 4. 渲染界面 =================
function getBookStats(bookId) {
  let readCount = 0;
  let scoreSum = 0;
  let scoreCount = 0;
  MEMBERS.forEach(m => {
    const r = getRec(bookId, m);
    if (r.is_read) readCount++;
    if (r.score && r.score > 0) {
      scoreSum += Number(r.score);
      scoreCount++;
    }
  });
  const avg = scoreCount > 0 ? (scoreSum / scoreCount).toFixed(1) : null;
  return { readCount, avg, scoreCount };
}

let globalTotalReads = 0;
let globalUnlockedBooks = 0;

function renderOverview() {
  document.getElementById("curMemberLabelText").textContent = currentMember;
  
  const dockSelect = document.getElementById("dockMemberSelect");
  dockSelect.innerHTML = MEMBERS.map(m => `<option value="${m}" ${m === currentMember ? 'selected' : ''}>${m}</option>`).join("");

  let personalReadCount = 0;
  BOOKS.forEach(b => { if (getRec(b.id, currentMember).is_read) personalReadCount++; });
  const personalPct = Math.round((personalReadCount / BOOKS.length) * 100);
  
  document.getElementById("personalCount").textContent = personalReadCount;
  document.getElementById("personalPct").textContent = personalPct + "%";
  document.getElementById("personalFill").style.width = personalPct + "%";

  globalTotalReads = 0;
  globalUnlockedBooks = 0;
  BOOKS.forEach(b => {
    const st = getBookStats(b.id);
    if (st.readCount > 0) globalUnlockedBooks++;
  });
  MEMBERS.forEach(m => {
    BOOKS.forEach(b => { if (getRec(b.id, m).is_read) globalTotalReads++; });
  });

  document.getElementById("unlockCount").textContent = globalUnlockedBooks;
  document.getElementById("totalReads").textContent = globalTotalReads;
  document.getElementById("totalFill").style.width = `${(globalTotalReads / (BOOKS.length * MEMBERS.length) * 100).toFixed(1)}%`;

  const grid = document.getElementById("membersGrid");
  grid.innerHTML = "";
  MEMBERS.forEach(m => {
    let cnt = 0;
    BOOKS.forEach(b => { if (getRec(b.id, m).is_read) cnt++; });
    const pct = Math.round((cnt / BOOKS.length) * 100);

    const card = document.createElement("div");
    card.className = `member-card ${m === currentMember ? "active" : ""}`;
    card.onclick = () => {
      currentMember = m;
      localStorage.setItem(USER_KEY, m);
      renderOverview();
      renderList();
    };
    card.innerHTML = `
      <div class="m-top">
        <span>${m}</span>
        <span class="m-cnt">${cnt}/71</span>
      </div>
      <div class="m-bar"><div class="m-fill" style="width:${pct}%"></div></div>
    `;
    grid.appendChild(card);
  });
}

function switchMemberFromDock(m) {
  currentMember = m;
  localStorage.setItem(USER_KEY, m);
  renderOverview();
  renderList();
}

async function openSharePoster() {
  const modal = document.getElementById("shareModal");
  const imgContainer = document.getElementById("posterImageContainer");
  const posterEl = document.getElementById("posterContainer");

  document.getElementById("posterMemberName").textContent = currentMember;
  let personalReadCount = 0;
  BOOKS.forEach(b => { if (getRec(b.id, currentMember).is_read) personalReadCount++; });
  document.getElementById("posterPersonalText").textContent = `${personalReadCount} / 71 部 (${Math.round(personalReadCount / 71 * 100)}%)`;
  document.getElementById("posterTotalReadsText").textContent = `${globalTotalReads} / 568`;

  imgContainer.innerHTML = '<div class="poster-loading">正在生成打卡海报…</div>';
  modal.classList.add("active");
  try {
    const canvas = await html2canvas(posterEl, {
      scale: 3,
      backgroundColor: "#fffcf7",
      width: 320,
      windowWidth: 360,
      useCORS: true
    });
    const img = document.createElement("img");
    img.src = canvas.toDataURL("image/png");
    img.alt = `${currentMember}的打卡分享海报`;
    img.draggable = false;
    imgContainer.replaceChildren(img);
  } catch (error) {
    console.error("打卡海报生成失败：", error);
    imgContainer.innerHTML = '<div class="poster-loading" role="alert">海报生成失败，请检查网络后重试。</div>';
  }
}

function closeSharePoster() {
  document.getElementById("shareModal").classList.remove("active");
}

function renderList() {
  const listEl = document.getElementById("bookList");
  const filterVal = document.getElementById("filterSel").value;
  const sortVal = document.getElementById("sortSel").value;
  const kw = document.getElementById("searchBox").value.trim().toLowerCase();

  let items = BOOKS.filter(b => {
    const myR = getRec(b.id, currentMember);
    const st = getBookStats(b.id);
    if (filterVal === "unread" && myR.is_read) return false;
    if (filterVal === "read" && !myR.is_read) return false;
    if (filterVal === "team_read" && st.readCount === 0) return false;
    if (kw) {
      const str = `第${b.id}回 ${b.y} ${b.title} ${b.author}`.toLowerCase();
      if (!str.includes(kw)) return false;
    }
    return true;
  });

  items.sort((a, b) => {
    if (sortVal === "id_asc") return a.id - b.id;
    if (sortVal === "id_desc") return b.id - a.id;
    const stA = getBookStats(a.id), stB = getBookStats(b.id);
    if (sortVal === "avg_desc") return (Number(stB.avg) || 0) - (Number(stA.avg) || 0);
    if (sortVal === "cnt_desc") return stB.readCount - stA.readCount;
    return a.id - b.id;
  });

  listEl.innerHTML = "";

  items.forEach(b => {
    const myR = getRec(b.id, currentMember);
    const st = getBookStats(b.id);

    const pillsHtml = MEMBERS.map(m => {
      const r = getRec(b.id, m);
      return `<span class="pill ${r.is_read ? "done" : ""}" title="${m}">${m}${r.score ? " ★" + r.score : ""}</span>`;
    }).join("");

    let starsHtml = "";
    for (let s = 1; s <= 5; s++) {
      starsHtml += `<span class="star ${(myR.score || 0) >= s ? "on" : ""}" onclick="setScore(${b.id}, '${currentMember}', ${s})">★</span>`;
    }

    let commentsHtml = "";
    MEMBERS.forEach(m => {
      const r = getRec(b.id, m);
      if (r.comment && r.comment.trim()) {
        commentsHtml += `<div class="c-row"><b>${m}:</b>${esc(r.comment)}</div>`;
      }
    });

    const row = document.createElement("div");
    row.className = `book-item ${myR.is_read ? "is-read" : ""}`;
    row.innerHTML = `
      <div class="b-header">
        <div class="b-info">
          <span class="b-id">第${b.id}回</span>
          <span class="b-title">${b.title}</span>
        </div>
        <div class="b-avg ${st.avg ? "" : "none"}">
          ${st.avg ? `⭐ ${st.avg}分 (${st.scoreCount})` : "暂无评分"}
        </div>
      </div>
      <div style="font-size:0.72rem; color:var(--muted); margin-bottom:6px;">作者：${b.author} ｜ 出版：${b.y}</div>
      <div class="pills">${pillsHtml}</div>
      <div class="my-action">
        <label class="read-btn">
          <input type="checkbox" ${myR.is_read ? "checked" : ""} onchange="toggleRead(${b.id}, '${currentMember}')">
          <span>${currentMember}已读</span>
        </label>
        <div class="stars">${starsHtml}</div>
        <input class="comment-box" type="text" placeholder="写句短评（回车保存）..." value="${esc(myR.comment)}" onchange="setComment(${b.id}, '${currentMember}', this.value)">
      </div>
      ${commentsHtml ? `<div class="comments-feed">${commentsHtml}</div>` : ""}
    `;
    listEl.appendChild(row);
  });
}

function toggleRead(bookId, member) {
  const cur = getRec(bookId, member);
  updateRec(bookId, member, { is_read: !cur.is_read });
}

function setScore(bookId, member, s) {
  const cur = getRec(bookId, member);
  const nextScore = cur.score === s ? null : s;
  updateRec(bookId, member, { score: nextScore, is_read: nextScore ? true : cur.is_read });
}

function setComment(bookId, member, text) {
  const cur = getRec(bookId, member);
  updateRec(bookId, member, { comment: text, is_read: text.trim() ? true : cur.is_read });
}

function esc(str) {
  if (!str) return "";
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

renderOverview();
renderList();
fetchFromSupabase();
</script>
